[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-biz"
version = "0.6.0"
description = "Sovereign Corporate Intelligence Engine & Commercial Contract Graph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kevin Ruschman", email = "kevin@krusch.dev"}
]
keywords = ["rag", "contracts", "corporate-intelligence", "sovereign-ai", "air-gapped", "krusch-nexus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.31.0"
]
dev = [
    "ruff>=0.2.0",
    "pytest>=8.0.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "alembic"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"scripts/*" = ["E402", "F401"]
"alembic/*" = ["E402"]
