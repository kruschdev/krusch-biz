description: "Authoritative US GAAP revenue recognition standards under ASC Topic 606 (Revenue from Contracts with Customers), 5-step contract evaluation, distinct performance obligations, Standalone Selling Price (SSP) allocation, and lease classification under ASC Topic 842."

